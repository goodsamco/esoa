<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>iOS Clinical Launchpad</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00e676;
            --primary-glow: rgba(0, 230, 118, 0.35);
            --glass-bg: rgba(22, 24, 28, 0.55);
            --glass-border: rgba(255, 255, 255, 0.12);
            --text-main: #ffffff;
            --text-sub: #a1a1aa;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #08090a;
            background-image: 
                radial-gradient(circle at 15% 15%, rgba(0, 230, 118, 0.12), transparent 45%),
                radial-gradient(circle at 85% 75%, rgba(0, 162, 255, 0.08), transparent 50%);
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Phone Container Frame */
        .phone-shell {
            width: 100%;
            max-width: 410px;
            height: 840px;
            max-height: 94vh;
            background: rgba(12, 14, 18, 0.7);
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.9), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px);
            -webkit-backdrop-filter: blur(40px);
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            position: relative;
            perspective: 1000px;
            justify-content: space-between;
        }

        /* Top Header Area */
        .top-bar {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            z-index: 10;
        }

        .profile-avatar-node {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 2px solid var(--primary);
            object-fit: cover;
            cursor: pointer;
            box-shadow: 0 0 12px var(--primary-glow);
            transition: transform 0.2s ease;
        }

        .profile-avatar-node:active {
            transform: scale(0.92);
        }

        /* Center Hero Area: Big Clock & Greetings */
        .hero-center {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: -20px;
        }

        .big-clock {
            font-family: 'Poppins', sans-serif;
            font-size: 3.8rem;
            font-weight: 700;
            letter-spacing: -1.5px;
            line-height: 1;
            background: linear-gradient(180deg, #ffffff 30%, rgba(255,255,255,0.6) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 12px;
            text-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .greeting-section {
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .greeting-section.loaded {
            opacity: 1;
            transform: translateY(0);
        }

        .greeting-text {
            font-size: 1.5rem;
            font-weight: 700;
            font-family: 'Poppins', sans-serif;
            color: var(--text-main);
        }

        .sub-greeting {
            font-size: 0.8rem;
            color: var(--text-sub);
            margin-top: 2px;
        }

        /* Bottom Container Setup */
        .bottom-area {
            display: flex;
            flex-direction: column;
            gap: 16px;
            width: 100%;
        }

        /* iOS Dock Wrapper */
        .dock-container {
            background: rgba(22, 24, 28, 0.65);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 12px 10px;
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        /* App Tile Base Mechanics */
        .app-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            text-decoration: none;
            color: var(--text-main);
            opacity: 0;
            transform: scale(2.5) translateY(-80px);
            filter: blur(10px);
            pointer-events: none;
        }

        /* Triggered Entrance Class */
        .app-item.fly-in {
            animation: iosDockFlyIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            pointer-events: auto;
        }

        .app-tile {
            width: 52px;
            height: 52px;
            border-radius: 16px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.35);
            transition: transform 0.2s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        }

        .app-tile img {
            width: 26px;
            height: 26px;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
        }

        .app-item:not(.disabled):active .app-tile {
            transform: scale(0.88);
            border-color: var(--primary);
            box-shadow: 0 0 16px var(--primary-glow);
        }

        .app-label {
            font-size: 0.65rem;
            font-weight: 500;
            margin-top: 5px;
            letter-spacing: -0.2px;
            color: rgba(255, 255, 255, 0.85);
            text-align: center;
            white-space: nowrap;
        }

        /* Inactive Apps Section */
        .disabled-grid {
            display: flex;
            justify-content: center;
            gap: 12px;
            opacity: 0.4;
        }

        .app-item.disabled {
            cursor: not-allowed;
            pointer-events: none;
        }

        .app-item.disabled .app-tile {
            background: rgba(255, 255, 255, 0.02);
            border-color: rgba(255, 255, 255, 0.05);
            box-shadow: none;
        }

        .app-item.disabled .app-tile img {
            filter: grayscale(100%);
        }

        /* Dock Fly-in Keyframe */
        @keyframes iosDockFlyIn {
            0% {
                opacity: 0;
                transform: scale(2.5) translateY(-80px);
                filter: blur(10px);
            }
            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
                filter: blur(0);
            }
        }
    </style>
</head>
<body>

<script>
    // Unauthenticated User Guard
    const activeUserId = localStorage.getItem("userId");
    if (!activeUserId) {
        window.location.href = "login.html";
    }
</script>

<div class="phone-shell">
    <!-- Top Bar -->
    <div class="top-bar">
        <img id="userDisplayAvatar" class="profile-avatar-node" src="https://api.dicebear.com/7.x/notionists/svg?seed=Felix" alt="User Avatar" onclick="window.location.href='customization.html'">
    </div>

    <!-- Centered Big Clock and Greetings -->
    <div class="hero-center">
        <div class="big-clock" id="liveClock">00:00</div>
        <div class="greeting-section" id="greetingBox">
            <div class="greeting-text">Hello, <span id="userDisplayName">User</span></div>
            <div class="sub-greeting">Welcome back to your workspace</div>
        </div>
    </div>

    <!-- Bottom Aligned Section -->
    <div class="bottom-area">
        <!-- Disabled Modules Row -->
        <div class="disabled-grid">
            <div class="app-item disabled fly-in" style="animation-delay: 0.05s;">
                <div class="app-tile">
                    <img src="https://api.iconify.design/lucide:user-check.svg?color=%23ffffff" alt="Senior">
                </div>
            </div>
            <div class="app-item disabled fly-in" style="animation-delay: 0.1s;">
                <div class="app-tile">
                    <img src="https://api.iconify.design/lucide:bar-chart-3.svg?color=%23ffffff" alt="Analytics">
                </div>
            </div>
            <div class="app-item disabled fly-in" style="animation-delay: 0.15s;">
                <div class="app-tile">
                    <img src="https://api.iconify.design/lucide:folder-heart.svg?color=%23ffffff" alt="Records">
                </div>
            </div>
        </div>

        <!-- Main iOS Bottom Dock -->
        <div class="dock-container">
            <!-- 1. eSOA -->
            <a href="esoa.html" class="app-item" id="app1">
                <div class="app-tile">
                    <img src="https://api.iconify.design/lucide:receipt.svg?color=%2300e676" alt="eSOA">
                </div>
                <span class="app-label">eSOA</span>
            </a>

            <!-- 2. ICD-10 -->
            <a href="icd10.html" class="app-item" id="app2">
                <div class="app-tile">
                    <img src="https://api.iconify.design/lucide:stethoscope.svg?color=%2300e676" alt="ICD-10">
                </div>
                <span class="app-label">ICD-10</span>
            </a>

            <!-- 3. CF4 -->
            <a href="cf4.html" class="app-item" id="app3">
                <div class="app-tile">
                    <img src="https://api.iconify.design/lucide:credit-card.svg?color=%2300e676" alt="CF4">
                </div>
                <span class="app-label">CF4</span>
            </a>

            <!-- 4. Profile -->
            <a href="customization.html" class="app-item" id="app4">
                <div class="app-tile">
                    <img src="https://api.iconify.design/lucide:user.svg?color=%2300e676" alt="Profile">
                </div>
                <span class="app-label">Profile</span>
            </a>

            <!-- 5. Payslip -->
            <a href="payslip.html" class="app-item" id="app5">
                <div class="app-tile">
                    <img src="https://api.iconify.design/lucide:wallet.svg?color=%2300e676" alt="Payslip">
                </div>
                <span class="app-label">Payslip</span>
            </a>
        </div>
    </div>
</div>

<!-- Firebase & Data Binding -->
<script type="module" src="esoa.js"></script>
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, doc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";
    import { getDatabase, ref, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    let db;
    let rtdb;
    let userDocRef;
    let appsTriggered = false;

    const userId = localStorage.getItem("userId");

    const premium3dAssets = {
        'avatar-m1': 'https://global.discourse-cdn.com/monzo/original/3X/8/6/866e6d84e8c756b19050fbe2ca0932858118614c.jpg',
        'avatar-f1': 'https://i.pinimg.com/474x/0e/d0/0d/0ed00d2ea51a4a714536d9b5d103827d.jpg'
    };

    try {
        const firebaseConfig = {
            apiKey: "AIzaSyDaeNQF4qmW0vvwxUPp_NztnT0hoLzm1BQ",
            authDomain: "svls-289ee.firebaseapp.com",
            databaseURL: "https://svls-289ee-default-rtdb.firebaseio.com",
            projectId: "svls-289ee",
            storageBucket: "svls-289ee.firebasestorage.app",
            messagingSenderId: "500705386198",
            appId: "1:500705386198:web:96f189662bc2aa99cf7377",
            measurementId: "G-5TNBMQ2HN5"
        };
        const app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        rtdb = getDatabase(app);
    } catch(e) {
        console.warn("RTDB environment connection local fallback initiated.");
    }

    // Function to trigger apps fly-in animation into dock
    function triggerAppsAnimation() {
        if (appsTriggered) return;
        appsTriggered = true;

        document.getElementById('greetingBox').classList.add('loaded');

        const activeApps = [
            document.getElementById('app1'),
            document.getElementById('app2'),
            document.getElementById('app3'),
            document.getElementById('app4'),
            document.getElementById('app5')
        ];

        activeApps.forEach((appEl, index) => {
            if(appEl) {
                appEl.style.animationDelay = `${index * 0.08}s`;
                appEl.classList.add('fly-in');
            }
        });
    }

    // Real-Time Firebase User Observer
    if (userId && db) {
        userDocRef = doc(db, "accounts", userId);
        onSnapshot(userDocRef, (snapshot) => {
            if (snapshot.exists()) {
                const data = snapshot.data();
                const currentUserName = data.customName || "Operator";
                const currentUserAvatarRaw = data.avatarUrl || "avatar-m1";

                document.getElementById('userDisplayName').innerText = currentUserName.split(' ')[0];
                document.getElementById('userDisplayAvatar').src = premium3dAssets[currentUserAvatarRaw] || currentUserAvatarRaw;

                if (data.bgValue) document.body.style.backgroundColor = data.bgValue;
                if (data.btnValue) document.documentElement.style.setProperty('--primary', data.btnValue);

                if (rtdb) {
                    set(ref(rtdb, 'presence/' + userId), {
                        uid: userId, 
                        name: currentUserName, 
                        avatar: currentUserAvatarRaw, 
                        timestamp: Date.now()
                    });
                }

                // Trigger apps animation once user profile is fetched
                triggerAppsAnimation();
            }
        });
    }

    // Fallback timer to ensure animation triggers if DB response is slow
    setTimeout(triggerAppsAnimation, 1200);

    // Live Clock Engine
    function updateClock() {
        const now = new Date();
        let hours = now.getHours();
        let minutes = now.getMinutes();
        hours = hours % 12;
        hours = hours ? hours : 12;
        minutes = minutes < 10 ? '0' + minutes : minutes;
        document.getElementById('liveClock').innerText = `${hours}:${minutes}`;
    }
    updateClock();
    setInterval(updateClock, 1000);
</script>

</body>
</html>
